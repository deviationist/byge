<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  :root, [data-theme="light"] { --surface:#FFF; --sunk:#EFEDE8; --ink:#15181B; --ink2:rgba(21,24,27,.62); --ink3:rgba(21,24,27,.40); --line:rgba(21,24,27,.10); --line2:rgba(21,24,27,.18); }
  [data-theme="dark"] { --surface:#16191C; --sunk:#1B1F22; --ink:#ECEEF0; --ink2:rgba(236,238,240,.60); --ink3:rgba(236,238,240,.38); --line:rgba(236,238,240,.12); --line2:rgba(236,238,240,.20); }
  @keyframes byge-pulse { 0%,100% { opacity:.3 } 50% { opacity:1 } }
</style>
</helmet>
<sc-if value="{{ shown }}" hint-placeholder-val="{{ true }}">
  <div data-theme="{{ theme }}" style="width:100%;display:flex;gap:12px;align-items:center;border:1px solid var(--line2);border-radius:11px;padding:12px 14px;background:var(--sunk);font-family:'IBM Plex Sans',system-ui,sans-serif;color:var(--ink)">
    <span style="flex:none;width:7px;height:7px;border-radius:50%;background:var(--ink2);animation:{{ pulse }}"></span>
    <span style="flex:1;display:flex;flex-direction:column;gap:3px">
      <span style="font-size:12.5px;line-height:1.4;color:var(--ink2)">{{ text }}</span>
      <span style="font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--ink3);letter-spacing:.03em">{{ meta }}</span>
    </span>
  </div>
</sc-if>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:420,&quot;height&quot;:90},&quot;mode&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;offline&quot;,&quot;refreshing&quot;,&quot;none&quot;],&quot;default&quot;:&quot;offline&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;ageMin&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:34,&quot;min&quot;:0,&quot;max&quot;:600,&quot;unit&quot;:&quot;min&quot;,&quot;tsType&quot;:&quot;number&quot;},&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;&quot;,&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;''|'light'|'dark'&quot;}}">
// StaleBanner — cached answer plus its age. Offline is the same component with
// a different reason; an older forecast is still a useful forecast, so the
// verdict stays on screen and this explains why it might have moved on.
class Component extends DCLogic {
  renderVals() {
    const mode = this.props.mode ?? 'offline';   // offline | refreshing | none
    const age = this.props.ageMin ?? 34;
    const map = {
      offline: { text: 'Showing the answer from ' + age + ' min ago — you are offline.', meta: 'It refreshes the moment you are back. Rain moves; this reading has not.' },
      refreshing: { text: 'Showing the answer from ' + age + ' min ago while a newer reading loads.', meta: 'about 1.3 s · it will update in place, nothing will jump' }
    };
    const m = map[mode];
    return { theme: this.props.theme ?? '', shown: !!m, text: m ? m.text : '', meta: m ? m.meta : '', pulse: mode === 'refreshing' ? 'byge-pulse 1.8s ease-in-out infinite' : 'none' };
  }
}

</script>
</body>
</html>
