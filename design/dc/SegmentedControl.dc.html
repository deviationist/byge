<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  :root, [data-theme="light"] { --bg:#F6F4F0; --surface:#FFF; --sunk:#EFEDE8; --ink:#15181B; --ink2:rgba(21,24,27,.62); --ink3:rgba(21,24,27,.40); --line:rgba(21,24,27,.10); --line2:rgba(21,24,27,.18); }
  [data-theme="dark"] { --bg:#0E1113; --surface:#16191C; --sunk:#1B1F22; --ink:#ECEEF0; --ink2:rgba(236,238,240,.60); --ink3:rgba(236,238,240,.38); --line:rgba(236,238,240,.12); --line2:rgba(236,238,240,.20); }
</style>
</helmet>
<div data-theme="{{ theme }}" style="display:inline-flex;flex-direction:column;gap:7px;width:{{ width }}">
  <div style="display:grid;grid-auto-flow:column;grid-auto-columns:1fr;width:{{ innerWidth }};gap:4px;padding:4px;border:1px solid var(--line);border-radius:12px;background:var(--sunk)">
    <sc-for list="{{ items }}" as="i" hint-placeholder-count="3">
      <button onClick="{{ i.onPress }}" title="{{ i.title }}" style="width:100%;cursor:pointer;font-family:{{ font }};font-size:{{ size }}px;min-height:{{ minH }}px;padding:0 14px;border-radius:9px;border:1px solid {{ i.border }};background:{{ i.background }};color:{{ i.color }};white-space:nowrap;display:flex;align-items:center;justify-content:center;gap:7px" style-focus="outline:2px solid var(--ink);outline-offset:2px">{{ i.label }}</button>
    </sc-for>
  </div>
  <sc-if value="{{ hasCaption }}" hint-placeholder-val="{{ false }}">
    <span style="font-family:'IBM Plex Mono',monospace;font-size:10px;line-height:1.6;color:var(--ink3)">{{ caption }}</span>
  </sc-if>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:360,&quot;height&quot;:80},&quot;value&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;system&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;mono&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;compact&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;full&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;caption&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;&quot;,&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;''|'light'|'dark'&quot;},&quot;options&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;{key:string,label:string,title?:string}[]&quot;},&quot;onChange&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(k: string) =&gt; void&quot;}}">
// SegmentedControl — one component, two uses: Appearance (light / dark / system)
// and the phase-2 basemap switcher (terrain / street / satellite / hybrid).
// `system` is a real selectable state, not a silent fallback: it shows which way
// the system currently resolves so following it is visible rather than implied.
class Component extends DCLogic {
  state = {};
  renderVals() {
    const options = this.props.options ?? [
      { key: 'light', label: 'Light' }, { key: 'dark', label: 'Dark' }, { key: 'system', label: 'System' }
    ];
    const value = this.state.v ?? (this.props.value ?? options[0].key);
    const mono = this.props.mono ?? false;
    return {
      theme: this.props.theme ?? '', width: this.props.full ? '100%' : 'auto',
      // equal-width segments: fr columns inside a max-content box all take the
      // width of the longest label, so "Dark" is not narrower than "System"
      innerWidth: this.props.full ? '100%' : 'max-content',
      font: mono ? "'IBM Plex Mono',monospace" : "'IBM Plex Sans',system-ui,sans-serif",
      size: mono ? 11 : 13, minH: this.props.compact ? 34 : 44,
      caption: this.props.caption ?? '', hasCaption: !!(this.props.caption ?? ''),
      items: options.map(o => {
        const on = o.key === value;
        return {
          label: o.label, title: o.title ?? o.label,
          background: on ? 'var(--ink)' : 'transparent',
          color: on ? 'var(--bg)' : 'var(--ink2)',
          border: on ? 'var(--ink)' : 'transparent',
          onPress: () => { this.setState({ v: o.key }); if (this.props.onChange) this.props.onChange(o.key); }
        };
      })
    };
  }
}

</script>
</body>
</html>
