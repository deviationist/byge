<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,200;0,6..72,300;0,6..72,400&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  :root, [data-theme="light"] { --bg:#F6F4F0; --surface:#FFF; --sunk:#EFEDE8; --ink:#15181B; --ink2:rgba(21,24,27,.62); --ink3:rgba(21,24,27,.40); --line:rgba(21,24,27,.10); --line2:rgba(21,24,27,.18); }
  [data-theme="dark"] { --bg:#0E1113; --surface:#16191C; --sunk:#1B1F22; --ink:#ECEEF0; --ink2:rgba(236,238,240,.60); --ink3:rgba(236,238,240,.38); --line:rgba(236,238,240,.12); --line2:rgba(236,238,240,.20); }
  @keyframes byge-breathe { 0%,100% { opacity:.35 } 50% { opacity:.7 } }
</style>
</helmet>
<div data-theme="{{ theme }}" style="width:100%;display:flex;flex-direction:column;gap:20px;font-family:'IBM Plex Sans',system-ui,sans-serif;color:var(--ink);max-width:38ch">

  <sc-if value="{{ isLoading }}" hint-placeholder-val="{{ false }}">
    <div style="display:flex;flex-direction:column;gap:16px">
      <span style="font-family:Newsreader,serif;font-weight:300;font-size:{{ size }}px;line-height:1.06;letter-spacing:-.015em;color:var(--ink3);animation:byge-breathe 1.6s ease-in-out infinite">Reading the radar…</span>
      <span style="display:flex;align-items:flex-end;gap:2px;height:34px;opacity:.32">
        <sc-for list="{{ ghost }}" as="g" hint-placeholder-count="24">
          <span style="flex:1;height:{{ g.h }}%;min-height:3px;border-radius:2px 2px 0 0;background:var(--line2)"></span>
        </sc-for>
      </span>
      <span style="font-family:'IBM Plex Mono',monospace;font-size:10.5px;line-height:1.7;color:var(--ink3)">First run, so there is nothing cached yet — about 1.3 s. Every open after this one answers instantly from cache and refreshes behind you.</span>
    </div>
  </sc-if>

  <sc-if value="{{ isError }}" hint-placeholder-val="{{ true }}">
    <div style="display:flex;flex-direction:column;gap:18px">
      <span style="font-family:Newsreader,serif;font-weight:300;font-size:{{ size }}px;line-height:1.06;letter-spacing:-.015em">{{ headline }}</span>
      <span style="font-size:13.5px;line-height:1.6;color:var(--ink2)">{{ body }}</span>
      <span style="display:flex;gap:10px;flex-wrap:wrap">
        <button onClick="{{ onRetry }}" style="cursor:pointer;font:inherit;font-size:14px;min-height:48px;padding:0 20px;border-radius:11px;border:1px solid var(--ink);background:var(--ink);color:var(--bg)">Try again</button>
        <button onClick="{{ onBack }}" style="cursor:pointer;font:inherit;font-size:14px;min-height:48px;padding:0 20px;border-radius:11px;border:1px solid var(--line2);background:transparent;color:var(--ink2)">Back to places</button>
      </span>
      <span style="font-family:'IBM Plex Mono',monospace;font-size:10.5px;line-height:1.7;color:var(--ink3);border-top:1px solid var(--line);padding-top:13px">{{ detail }}</span>
    </div>
  </sc-if>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:420,&quot;height&quot;:330},&quot;mode&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;cold&quot;,&quot;error&quot;,&quot;badCoords&quot;],&quot;default&quot;:&quot;error&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;size&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:34,&quot;min&quot;:22,&quot;max&quot;:56,&quot;unit&quot;:&quot;px&quot;,&quot;tsType&quot;:&quot;number&quot;},&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;&quot;,&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;''|'light'|'dark'&quot;},&quot;onRetry&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;},&quot;onBack&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;}}">
// ErrorState — deliberately NOT the stale banner.
//   cold      first ever run, no cache to show. A quiet held frame with a ghost
//             graph, never a spinner that reads as failure.
//   error     we are online, MET is unreachable or the request failed, and we
//             have nothing to fall back on. We say which, and we do not dress
//             it as "offline".
// Where a cached verdict DOES exist, this screen never appears — StaleBanner
// and RefreshControl carry it, with the old answer still on screen.
class Component extends DCLogic {
  renderVals() {
    const mode = this.props.mode ?? 'error';
    const map = {
      error: {
        headline: 'We cannot reach the radar.',
        body: 'You are online, but MET Norway’s service is not answering. There is no earlier reading saved for this place, so we would rather show you nothing than guess.',
        detail: 'thredds.met.no · request failed · nothing cached for this coordinate'
      },
      badCoords: {
        headline: 'That coordinate will not do.',
        body: 'MET rejects coordinates finer than four decimals. Four decimals is about eleven metres — closer than radar can see anyway.',
        detail: 'HTTP 403 · lat/lon rounded to 4 dp before every request'
      }
    };
    const m = map[mode] || map.error;
    return {
      theme: this.props.theme ?? '', size: this.props.size ?? 34,
      isLoading: mode === 'cold', isError: mode !== 'cold',
      headline: m.headline, body: m.body, detail: m.detail,
      ghost: Array.from({ length: 24 }, (_, i) => ({ h: 12 + Math.round(Math.abs(Math.sin(i * 0.7)) * 46) })),
      onRetry: this.props.onRetry, onBack: this.props.onBack
    };
  }
}

</script>
</body>
</html>
